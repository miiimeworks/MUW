; MIIIME Universal Wrapper Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

; =======================================================================================
; 폴더 구조 / Folder Structure
; =======================================================================================
;
;   TargetAppPortable/
;   │
;   ├─ MIIIMEUniWrapper.exe		래퍼 실행 파일			/ Wrapper executable
;   ├─ MIIIMEUniWrapper.ini		래퍼 설정 파일			/ Configuration file
;   ├─ MIIIMEUniWrapper.log		실행 로그				/ Runtime log
;   │
;   └─ MUW_Dat/                	사용자 데이터 저장소		/ Active user data
;   	└─ RegBakk/            	레지스트리 호스트 백업 임시 저장 (자동 생성) / Registry Host Backup Temporary Storage (Automatically generated)

; =======================================================================================
; 지원 매크로 / Available Macros
; =======================================================================================
;
;   {Base}              런처 최상위 폴더					/ Launcher root folder
;   {System32}			C:\Windows\System32
;   {SysWOW64}          C:\Windows\SysWOW64
;   {ProgramData}		C:\ProgramData
;   {UserProfile}		C:\Users\[UserName]
;   {Desktop}			바탕화면                			/ Desktop
;   {Local}         	%LocalAppData%
;   {Roaming}       	%AppData%
;   {LocalLow}      	%UserProfile%\AppData\LocalLow
;   {Temp}				임시 폴더						/ Temp folder
;   {Programs}			프로그램 목록 폴더       			/ Programs folder


[Launch]
; 런처 기본 실행 설정
; Basic launch settings
; ----------------------------------------------------------------------------------------

; 관리자 권한으로 실행 (1=사용, 0=미사용).
; Run as administrator (1=Enable, 0=Disable).
RunAsAdmin=0

; 다중 인스턴스 허용 여부 (1=허용, 0=차단).
; Allow multiple instances (1=Allow, 0=Block).
AllowMultipleInstances=1

; 모체 포터블 런처 실행 파일명 (RunPath 폴더 기준).
; Portable Executable filename (relative to RunPath).
PortableExeName=TargetAppPortable.exe

; 64비트 OS에서 우선 실행할 파일명 (비워두면 ExeName 사용).
; Portable Executable for 64-bit OS (leave empty to use ExeName).
PortableExeName64=TargetAppPortable64.exe

[Options]
; 런처 동작 옵션
; Launcher behavior options
; ----------------------------------------------------------------------------------------

; 로그 레벨
; LogLevel : 0=Off / 1=All(DEBUG+) / 2=INFO+ / 3=WARN+ / 4=ERROR
LogLevel=0

[ProcessWatch]
; 타겟 앱(ExeName) 외에 추가로 종료를 감시할 프로세스
; Additional processes to monitor for exit, besides the main app(ExeName)
; ----------------------------------------------------------------------------------------

; 등록된 모든 프로세스가 종료된 후 최종 정리 시작.
; Cleanup starts only after ALL registered processes have terminated.
; 런처는 자식 프로세스를 자동 추적하지 않으므로, 별도로 실행되는 프로세스는 반드시 등록.
; The launcher does not auto-track child processes. Register any separately spawned processes here.
01=AppHelper.exe
02=UpdateService.exe

[AppData]
; 청소할 AppData 폴더 목록
; List of AppData folders to clean
; ----------------------------------------------------------------------------------------

; SmartSkip : 0=항상실행(기본) / 1=환경변경시만 / 2=항상스킵
SmartSkip=0

Roaming01=TargetAppReal
Local01=TargetAppReal
LocalLow01=TargetAppReal

; ※ [CleanupExclude/Delete] 와 같은 경로에 중복 지정 금지.
; ※ Do not specify duplicate paths such as [CleanupExclude/Delete].

[Registry]
; 레지스트리 제어
; Registry control
; ----------------------------------------------------------------------------------------

SmartSkip=0

; 청소할 호스트 레지스트리 키 목록.
; List of host registry keys to clean.
01=HKEY_CURRENT_USER\SOFTWARE\TargetAppReal

[Injection]
; 파라미터 주입
; Injection parameters
; ----------------------------------------------------------------------------------------

; 지원 형식: .ini / .txt / .yml
;   .ini → IniWrite(Section, Key, Value).
;   .txt → Value 가 없으면 파일 끝에 추가.
;   .yml → args: [...] 패턴을 Value 로 교체.
; File 을 비워두면 이 기능을 사용하지 않음.

File=StartupParm.txt
Section=
Key=
Value=--disable-features=Translate

[CleanupExclude]
; 지정 항목 제외(보존) 클린업
; Cleanup excluding(Keep) items
; ----------------------------------------------------------------------------------------

SmartSkip=2

; ======================================================================
; 지원 와일드카드 (파일 경로에 사용 가능) / Supported wildcards (in file path)
; ======================================================================
; ~  →  0개 이상의 임의 문자 / Any number of any characters.
; ^  →  정확히 1개의 임의 문자 / Exactly one character (any).
01={Roaming}\TargetAppReal\profile\prefs.js
02={Roaming}\TargetAppReal\profile\chrome

; ※ [AppData]와 같은 경로에 중복 지정 금지.
; ※ Do not specify duplicate paths such as [AppData].

[CleanupDelete]
; 지정 항목 클린업
; Cleanup items
; ----------------------------------------------------------------------------------------

SmartSkip=2

; ======================================================================
; 지원 와일드카드 / Supported wildcards
; ======================================================================
; [CleanupExclude] 와 동일 / Same as [CleanupExclude]
; ~  →  0개 이상의 임의 문자 / Any number of any characters.
; ^  →  정확히 1개의 임의 문자 / Exactly one character (any).
01={Local}\TargetAppReal\Cache
02={Roaming}\TargetAppReal\^^^^^^^^^^^^^^^^.json

; ※ [AppData]와 같은 경로에 중복 지정 금지.
; ※ Do not specify duplicate paths such as [AppData].

[ShortcutGuard]
; 바로가기 보호 및 종료 후 재생성 감시
; Shortcut guard and post-exit re-creation watch
; ----------------------------------------------------------------------------------------

; 실행 전 : 지정한 이름의 폴더 및 .lnk 를 _bakk 로 백업.
; 종료 후 : Wait 시간 동안 앱이 새로 만든 동일 이름의 바로가기를 삭제한 뒤, 원래 이름으로 복원.
; Before launch : Back up folders and .lnk files with the given names as _bakk.
; After exit    : For the Wait duration, delete same-named shortcuts the app re-creates, then restore the originals.

; 검사 위치 / Scan locations (6) :
;   Start Menu\Programs, Start Menu (사용자 / All Users), Desktop (사용자 / Public)
;   ※ All Users / Public 경로의 삭제는 관리자 권한이 필요함. 권한이 없으면 로그만 남기고 계속 진행.
;   ※ Deleting from All Users / Public paths requires administrator rights. Without them, only a log entry is written.

; 보호/감시할 바로가기 이름 (|이름1|이름2| 형식, 비워두면 이 섹션 전체를 사용하지 않음).
; 폴더명 또는 .lnk 확장자를 뺀 파일명과 정확히 일치해야 함 (포함 일치 아님).
; Shortcut names to protect/watch (|Name1|Name2| format, leave empty to disable this whole section).
; Must exactly match the folder name or the .lnk file name without extension (not a partial match).
Name=|TargetAppReal|TargetAppReal Manager|

; 종료 후 바로가기 재생성 감시 시간 (초). 0 = 감시 안 함 (백업/복원만 수행).
; 앱 종료 감지 시점부터 계산하므로 이후 정리 단계에 걸린 시간은 이 값에서 차감됨.
; Watch duration after exit (seconds). 0 = no watch (backup/restore only).
; Counted from the moment the app exit is detected, so time spent in later cleanup steps is deducted.
Wait=10

; 감시 중 폴링 간격 (밀리초, 최소 100).
; Polling interval during the watch (milliseconds, minimum 100).
Interval=500

[Advanced]
; 고급 최적화 및 타임아웃 설정
; Advanced optimization and timeout settings
; ----------------------------------------------------------------------------------------

; 파일 이동/삭제 실패 시 재시도 횟수.
; Number of retries on file move/delete failure.
RetryLimit=10

; 재시도 간격 (밀리초).
; Retry interval (milliseconds).
RetryDelay=50

; 로그 파일 최대 크기 (Bytes, 초과 시 .old 로 백업 후 새로 시작) 기본값 5242880 = 5MB.
; Maximum log file size in bytes (rotates to .old when exceeded) default 5242880 = 5MB.
LogRotationSize=5242880
