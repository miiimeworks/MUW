; =======================================================================================
; 폴더 구조 / Folder Structure
; =======================================================================================
;
;   TargetAppPortable/
;   │
;   ├─ MIIIMEUniWrapper.exe		래퍼 실행 파일			/ Wrapper executable
;   ├─ MIIIMEUniWrapper.ini		래퍼 설정 파일			/ Configuration file
;   ├─ MIIIMEUniWrapper.log		실행 로그				/ Runtime log
;   │
;   └─ MUW_Dat/                	사용자 데이터 저장소		/ Active user data
;   	└─ RegBakk/            	레지스트리 호스트 백업 임시 저장 (자동 생성) / Registry Host Backup Temporary Storage (Automatically generated)

; =======================================================================================
; 지원 매크로 / Available Macros
; =======================================================================================
;
;   {Base}              런처 최상위 폴더					/ Launcher root folder
;   {Windows}			C:\Windows
;   {System32}			C:\Windows\System32
;   {SysWOW64}          C:\Windows\SysWOW64
;   {ProgramFiles}		C:\Program Files
;   {ProgramFiles(x86)}	C:\Program Files (x86)
;   {ProgramData}		C:\ProgramData
;   {UserProfile}		C:\Users\[UserName]
;   {Docs}			문서 폴더                		/ Documents folder
;   {Desktop}			바탕화면                			/ Desktop
;   {Local}         	%LocalAppData%
;   {Roaming}       	%AppData%
;   {LocalLow}      	%UserProfile%\AppData\LocalLow
;   {Temp}				임시 폴더						/ Temp folder
;   {Programs}			프로그램 목록 폴더       			/ Programs folder
;   %VAR%           		임의 환경 변수              		/ Any environment variable


[Launch]
; 런처 기본 실행 설정
; Basic launch settings
; ----------------------------------------------------------------------------------------

; 관리자 권한으로 실행 (1=사용, 0=미사용).
; Run as administrator (1=Enable, 0=Disable).
RunAsAdmin=0

; 다중 인스턴스 허용 여부 (1=허용, 0=차단).
; Allow multiple instances (1=Allow, 0=Block).
AllowMultipleInstances=1

; 모체 포터블 런처 실행 파일명 (RunPath 폴더 기준).
; Portable Executable filename (relative to RunPath).
PortableExeName=TargetAppPortable.exe

; 64비트 OS에서 우선 실행할 파일명 (비워두면 ExeName 사용).
; Portable Executable for 64-bit OS (leave empty to use ExeName).
PortableExeName64=TargetAppPortable64.exe

[Options]
; 런처 동작 옵션
; Launcher behavior options
; ----------------------------------------------------------------------------------------

; 로그 레벨
; LogLevel : 0=Off / 1=All(DEBUG+) / 2=INFO+ / 3=WARN+ / 4=ERROR
LogLevel=0

[ProcessWatch]
; 타겟 앱(ExeName) 외에 추가로 종료를 감시할 프로세스
; Additional processes to monitor for exit, besides the main app(ExeName)
; ----------------------------------------------------------------------------------------

; 등록된 모든 프로세스가 종료된 후 최종 정리 시작.
; Cleanup starts only after ALL registered processes have terminated.
; 런처는 자식 프로세스를 자동 추적하지 않으므로, 별도로 실행되는 프로세스는 반드시 등록.
; The launcher does not auto-track child processes. Register any separately spawned processes here.
01=AppHelper.exe
02=UpdateService.exe

[AppData]
; 청소할 AppData 폴더 목록
; List of AppData folders to clean
; ----------------------------------------------------------------------------------------

; SmartSkip : 0=항상실행(기본) / 1=환경변경시만 / 2=항상스킵
SmartSkip=0

Roaming01=TargetAppReal
Local01=TargetAppReal
LocalLow01=TargetAppReal

; ※ [CleanupExclude/Delete] 와 같은 경로에 중복 지정 금지.
; ※ Do not specify duplicate paths such as [CleanupExclude/Delete].

[Registry]
; 레지스트리 제어
; Registry control
; ----------------------------------------------------------------------------------------

SmartSkip=0

; 청소할 호스트 레지스트리 키 목록.
; List of host registry keys to clean.
01=HKEY_CURRENT_USER\SOFTWARE\TargetAppReal

[FileWrite]
; 지정한 파일의 내용을 수정
; Modifies the contents of specified files
; ----------------------------------------------------------------------------------------

; ※ 이미 존재하는 파일의 내용만 수정함. 대상 파일이 없으면 건너뛰며 새로 만들지 않음.
; ※ Only modifies files that already exist. If the target file is missing, it is skipped and never created.

; ── 내장 안전장치 / Built-in Safety Guard ──
; 수정 가능한 파일은 기본적으로 {Base} / {Local} / {Roaming} / {LocalLow} 아래로 제한됨.
; 그 밖에 Wrapper 폴더 자체, Wrapper exe / ini / 로그, 모체 포터블 exe, 사용자 프로필·Windows·ProgramFiles 등의 루트와
; System32\config 는 항상 차단됨. 위반 항목은 로그에 기록되고 건너뜀.
; By default only files under {Base} / {Local} / {Roaming} / {LocalLow} can be modified.
; The Wrapper folder itself, the Wrapper exe / ini / log, the portable executable, the roots of UserProfile / Windows /
; ProgramFiles and System32\config are always blocked. Violating entries are logged and skipped.

; 실행 전(타겟 실행 직전)에 적용됨. 회수는 하지 않음.
; Applied just before the target is launched. Nothing is reverted afterwards.

; SmartSkip=0 : 항상 실행 / Always run.
; SmartSkip=1 : 경로 · 호스트 변경 감지 시에만 실행 (기본값) / Run only when env change detected (default).
; SmartSkip=2 : 항상 통과 (비활성) / Always skip (disabled).
SmartSkip=1

; ======================================================================
; 지원 와일드카드 (파일 경로에 사용 가능) / Supported wildcards (in file path)
; ======================================================================
; ~  →  0개 이상의 임의 문자 / Any number of any characters.
; ^  →  정확히 1개의 임의 문자 / Exactly one character (any).
;
; ※ 와일드카드는 파일 경로의 파일명(마지막 세그먼트)에만 사용할 것. 부모 폴더 경로는 실제 경로여야 함.
; ※ Use wildcards only in the filename (last segment) of the file path. The parent folder path must be a real path.
; ※ 항목은 | 로 구분하므로 찾을 문자열 · 정규식에는 | 를 사용할 수 없음.
; ※ Entries are separated by |, so | cannot be used in the find string or regex.

; 예시 : 버전 번호가 달라지는 설정 파일 처리.
; Example : Handle config file with changing version number.
01={Base}\profile\prefs~.js|FindStr|ReplaceStr

; ======================================================================
; 유형 A : 텍스트 직접 치환, 없으면 추가 / Type A : Replace or Append.
; 형식 : 파일경로|찾을문자열|바꿀문자열
; Format : FilePath|FindString|ReplaceString
;
; 동작 순서 / Order of operations :
;   1) 바꿀 문자열이 이미 있으면 → 건너뜀 (멱등성) / ReplaceString already present → skip (idempotent).
;   2) 찾을 문자열이 있으면      → 바꿀 문자열로 치환 / FindString present → replace.
;   3) 찾을 문자열도 없으면      → 파일 끝에 바꿀 문자열 추가 / Neither present → append ReplaceString at the end.
;
; ※ 찾을 문자열을 비우면 2) 를 건너뛰고, 바꿀 문자열이 없을 때만 파일 끝에 추가함.
; ※ If FindString is empty, step 2 is skipped; ReplaceString is appended only when it is not already present.
; ※ 바꿀 문자열을 비우면 찾을 문자열을 삭제함 (없으면 아무것도 하지 않음).
; ※ If ReplaceString is empty, FindString is deleted (nothing happens if it is absent).

; 예시 : 설정 파일의 하드코딩된 경로를 현재 실행 경로로 치환.
; Example : Replace hardcoded path in a config file with the current path.
01={Base}\Config.xml|<WorkDir>C:\OldPath</WorkDir>|<WorkDir>{Base}</WorkDir>

; 예시 : 시작 인수 파일에 인수가 없을 때만 한 줄 추가 (이전 버전의 [Injection] .txt 방식).
; Example : Append one line to a startup-parameter file only when it is not there yet (old [Injection] .txt behavior).
02={Base}\StartupParm.txt||--disable-features=Translate

; ── 유형 A-R : 정규식 치환 / Type A-R : Regex Replace. ──
; 형식 : 파일경로|R:정규식패턴|바꿀문자열
; Format : FilePath|R:RegexPattern|ReplaceString
; 찾을 문자열이 "R:"로 시작하면 StringRegExpReplace를 사용.
; If FindString starts with "R:", StringRegExpReplace is used.
; 패턴 불일치 시 Append를 수행하지 않고 DEBUG 로그만 남김.
; On pattern mismatch, no Append is performed - DEBUG log only.
; ※ 정규식이 잘못된 경우 WARN 로그 후 해당 항목의 파일 쓰기를 중단함.
; ※ If the regex is invalid, a WARN is logged and the write is aborted for that entry.

; 예시 : <LastCheck>숫자</LastCheck> 줄을 통째로 제거.
; Example : Remove the entire <LastCheck>number</LastCheck> line.
03={Base}\Config.xml|R:<LastCheck>\d+</LastCheck>(\r?\n)?|

; 예시 : .yml 의 args: [...] 를 교체 (이전 버전의 [Injection] .yml 방식).
; Example : Replace args: [...] in a .yml file (old [Injection] .yml behavior).
04={Base}\config.yml|R:args:\s*\[.*?\]|args: ["--disable-features=Translate"]

; ======================================================================
; 유형 B : INI 섹션 + 키 직접 수정 / Type B : Direct INI Section + Key Modification.
; 형식 : 파일경로|Section:섹션|Key:키|새값 (현재 값과 동일하면 쓰기를 건너뜀 - 멱등성 보장).
; Format : FilePath|Section:Section|Key:Key|NewValue (Skips write if value is already current - idempotent).

; 예시 : 앱 설정 파일의 저장 경로를 Base 폴더로 업데이트.
; Example : Update save path in app config to the Base folder.
05={Base}\settings.ini|Section:Main|Key:SavePath|{Base}\Saves

; ======================================================================
; 유형 C: 키 자동 감지 교체 / Type C: Auto-Detect Key Replace.
; 형식 : 파일경로|Key:키이름|새값 (JS, JSON 형식 감지 시 역슬래시를 자동으로 이중화).
; Format : FilePath|Key:KeyName|NewValue (Automatically doubles backslashes when detecting JS and JSON formats).

; 예시 : Notepad4.ini의 DefaultDirectory를 현재 실행 경로로 교체.
; Example : Auto-replace DefaultDirectory in Notepad4.ini with the current path.
06={Base}\Notepad4.ini|Key:DefaultDirectory|{Base}

; ※ 주의 : 같은 키가 여러 섹션에 있으면 모두 교체됨. 특정 섹션만 수정하려면 유형 B를 사용.
; ※ Cautions : All occurrences are replaced if the same key exists in multiple sections. Use Type B for section-specific modification.

[CleanupExclude]
; 지정 항목 제외(보존) 클린업
; Cleanup excluding(Keep) items
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; 보존 목록의 부모 폴더는 다음 기본 규칙으로 검사되며, 위반 시 해당 그룹은 로그에 기록되고 건너뜀.
; The parent folder of the keep list is checked by the default rules below; a violating group is logged and skipped.
;   - 로컬 절대 경로만 허용 (Wrapper 폴더와 같은 UNC 공유 포함) / Local absolute paths only (plus UNC share of the Wrapper folder).
;   - 드라이브 루트, Wrapper 폴더({Base})와 그 상위 폴더, Wrapper exe / ini / 로그, 모체 포터블 exe 는 항상 차단 / Always blocked.
;   - 기본 차단 / Blocked by default : Documents, Desktop, Downloads, Pictures, Music, Videos, Favorites, Links,
;     Saved Games, Searches, OneDrive, Dropbox, Google Drive, Microsoft, Windows, Packages, Boot, PerfLogs, ProgramFiles, ProgramFiles(x86).

; ※ 주의 : Wrapper 외부 경로를 조작할 경우 호스트 시스템에 영구적인 변경이 가해질 수 있음.
; ※ Cautions : Manipulating paths outside the Wrapper may cause permanent changes to the host system.

SmartSkip=2

; ======================================================================
; 지원 와일드카드 (파일 경로에 사용 가능) / Supported wildcards (in file path)
; ======================================================================
; ~  →  0개 이상의 임의 문자 / Any number of any characters.
; ^  →  정확히 1개의 임의 문자 / Exactly one character (any).
01={Roaming}\TargetAppReal\profile\prefs.js
02={Roaming}\TargetAppReal\profile\chrome

; ※ [AppData]와 같은 경로에 중복 지정 금지.
; ※ Do not specify duplicate paths such as [AppData].

[CleanupDelete]
; 지정 항목 클린업
; Cleanup items
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; 삭제 대상(와일드카드로 해석된 실제 대상 포함)은 [CleanupExclude] 와 같은 기본 규칙으로 검사되며,
; 위반 항목은 로그에 기록되고 건너뜀.
; Delete targets (including wildcard-resolved ones) are checked by the same default rules as [CleanupExclude];
; violating entries are logged and skipped.
;   - 따라서 {Desktop}\~.lnk 같은 바탕화면 바로가기 삭제는 기본적으로 차단됨 (바로가기는 [ShortcutGuard] 사용).
;     Therefore deleting desktop shortcuts such as {Desktop}\~.lnk is blocked by default (use [ShortcutGuard] for shortcuts).

; ※ 주의 : Wrapper 외부 경로를 조작할 경우 호스트 시스템에 영구적인 변경이 가해질 수 있음.
; ※ Cautions : Manipulating paths outside the Wrapper may cause permanent changes to the host system.

SmartSkip=2

; ======================================================================
; 지원 와일드카드 / Supported wildcards
; ======================================================================
; [CleanupExclude] 와 동일 / Same as [CleanupExclude]
; ~  →  0개 이상의 임의 문자 / Any number of any characters.
; ^  →  정확히 1개의 임의 문자 / Exactly one character (any).
01={Local}\TargetAppReal\Cache
02={Roaming}\TargetAppReal\^^^^^^^^^^^^^^^^.json

; ※ [AppData]와 같은 경로에 중복 지정 금지.
; ※ Do not specify duplicate paths such as [AppData].

[ShortcutGuard]
; 바로가기 보호 및 종료 후 재생성 감시
; Shortcut guard and post-exit re-creation watch
; ----------------------------------------------------------------------------------------

; 실행 전 : 지정한 이름의 폴더 및 .lnk 를 _bakk 로 백업.
; 종료 후 : Wait 시간 동안 앱이 새로 만든 동일 이름의 바로가기를 삭제한 뒤, 원래 이름으로 복원.
; Before launch : Back up folders and .lnk files with the given names as _bakk.
; After exit    : For the Wait duration, delete same-named shortcuts the app re-creates, then restore the originals.

; 검사 위치 / Scan locations (6) :
;   Start Menu\Programs, Start Menu (사용자 / All Users), Desktop (사용자 / Public)
;   ※ All Users / Public 경로의 삭제는 관리자 권한이 필요함. 권한이 없으면 로그만 남기고 계속 진행.
;   ※ Deleting from All Users / Public paths requires administrator rights. Without them, only a log entry is written.

; 보호/감시할 바로가기 이름 (|이름1|이름2| 형식, 비워두면 이 섹션 전체를 사용하지 않음).
; 폴더명 또는 .lnk 확장자를 뺀 파일명과 정확히 일치해야 함 (포함 일치 아님).
; Shortcut names to protect/watch (|Name1|Name2| format, leave empty to disable this whole section).
; Must exactly match the folder name or the .lnk file name without extension (not a partial match).
Name=|TargetAppReal|TargetAppReal Manager|

; 종료 후 바로가기 재생성 감시 시간 (초). 0 = 감시 안 함 (백업/복원만 수행).
; 앱 종료 감지 시점부터 계산하므로 이후 정리 단계에 걸린 시간은 이 값에서 차감됨.
; Watch duration after exit (seconds). 0 = no watch (backup/restore only).
; Counted from the moment the app exit is detected, so time spent in later cleanup steps is deducted.
Wait=10

; 감시 중 폴링 간격 (밀리초, 최소 100).
; Polling interval during the watch (milliseconds, minimum 100).
Interval=500

[Advanced]
; 고급 최적화 및 타임아웃 설정
; Advanced optimization and timeout settings
; ----------------------------------------------------------------------------------------

; 파일 이동/삭제 실패 시 재시도 횟수.
; Number of retries on file move/delete failure.
RetryLimit=10

; 재시도 간격 (밀리초).
; Retry interval (milliseconds).
RetryDelay=50

; 로그 파일 최대 크기 (Bytes, 초과 시 .old 로 백업 후 새로 시작) 기본값 5242880 = 5MB.
; Maximum log file size in bytes (rotates to .old when exceeded) default 5242880 = 5MB.
LogRotationSize=5242880
