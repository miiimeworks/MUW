; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
RunAsAdmin=0
AllowMultipleInstances=0
PortableExeName=TargetAppPortable.exe
;PortableExeName64=TargetAppPortable64.exe

[Options]
LogLevel=0

[ProcessWatch]
;01=AppHelper.exe
;02=UpdateService.exe

[AppData]
SmartSkip=2

;Roaming01=TargetAppReal
;Local01=TargetAppReal
;LocalLow01=TargetAppReal

[Registry]
SmartSkip=0

01=HKEY_CURRENT_USER\SOFTWARE\TargetAppReal

[Injection]
;File=StartupParm.txt
;Section=
;Key=
;Value=--disable-features=Translate

[CleanupExclude]
SmartSkip=2

;01={Roaming}\TargetAppReal\profile\prefs.js
;02={Roaming}\TargetAppReal\profile\chrome

[CleanupDelete]
SmartSkip=2

;01={Local}\TargetAppReal\Cache
;02={Roaming}\TargetAppReal\^^^^^^^^^^^^^^^^.json

[ShortcutGuard]
;Name=|TargetAppReal|TargetAppReal Manager|
Wait=10
Interval=500

[Advanced]
RetryLimit=10
RetryDelay=50
LogRotationSize=5242880
