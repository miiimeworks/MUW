; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
RunAsAdmin=0
AllowMultipleInstances=0
PortableExeName=FirefoxPortable.exe

[Registry]
SmartSkip=0
; 다중 키 지원 (순서대로 Key1, Key2, Key3...)
Key1=HKEY_CURRENT_USER\SOFTWARE\Mozilla
Key2=HKEY_CURRENT_USER\SOFTWARE\Tor Project

[Injection]
File=FirefoxPortable.ini
Section=FirefoxPortable
Key=AdditionalParameters
Value=--no-deelevate

[CleanupExclude]
SmartSkip=2

[CleanupDelete]
SmartSkip=2

[Advanced]
RetryLimit=10
RetryDelay=50
LogRotationSize=5242880