; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
RunAsAdmin=0
AllowMultipleInstances=0
PortableExeName=catsxp.exe

[Options]
LogLevel=0

[AppData]
SmartSkip=2
Roaming01=catsxp

[Registry]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\CatsxpSoftware

[Injection]
File=StartupParm.txt
Section=
Key=
; ★ Value 앞에 --를 포함해서 작성 (TXT 파일 맨 뒤에 한 줄이 추가됨)
; 예: 번역 기능 끄기 옵션 추가
Value=--disable-features=Translate

[CleanupExclude]
SmartSkip=2

[CleanupDelete]
SmartSkip=2

[Advanced]
RetryLimit=10
RetryDelay=50
LogRotationSize=5242880
