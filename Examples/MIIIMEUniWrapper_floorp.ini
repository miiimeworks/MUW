; MIIIME Universal Wrapper Configuration
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
RunAsAdmin=0
AllowMultipleInstances=0
PortableExeName=floorp-portable.exe

[Options]
LogLevel=0

[ProcessWatch]
01=floorp.exe
02=private_browsing.exe

[AppData]
SmartSkip=0
Roaming1=Mozilla
Roaming2=Ablaze
Roaming3=Floorp

[Registry]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\Mozilla
02=HKEY_CURRENT_USER\SOFTWARE\Ablaze
03=HKEY_CURRENT_USER\SOFTWARE\Floorp

[Injection]
File=floorp-portable.yml
Section=common:
Key=args
; ★ 따옴표는 스크립트가 알아서 처리하므로, 명령어만 적어줍니다.
Value=--no-deelevate

[CleanupExclude]
SmartSkip=2

[CleanupDelete]
SmartSkip=2

[Advanced]
RetryLimit=10
RetryDelay=50
LogRotationSize=5242880