[Launch]
RunAsAdmin=0
AllowMultipleInstances=0
PortableExeName=4KVideoDownloaderPlusPortable.exe
;PortableExeName64=4KVideoDownloaderPlusPortable.exe

[Options]
LogLevel=0

[ProcessWatch]
;01=AppHelper.exe
;02=UpdateService.exe

[AppData]
SmartSkip=0
Roaming01=4kdownload.com

[Registry]
SmartSkip=0
;01=HKEY_CURRENT_USER\SOFTWARE\TargetAppReal

[Injection]
;File=StartupParm.txt
;Section=
;Key=
;Value=--disable-features=Translate

[CleanupExclude]
SmartSkip=2

;01={Roaming}\TargetApp\profile\prefs.js
;02={Roaming}\TargetApp\profile\chrome

[CleanupDelete]
SmartSkip=2
01=Data\4kdownload

[ShortcutGuard]
;Name=|TargetAppReal|TargetAppReal Manager|
Wait=10
Interval=500

[Advanced]
RetryLimit=10
RetryDelay=50
LogRotationSize=5242880
